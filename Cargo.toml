[workspace]
members = ["crates/slate-core", "crates/slate-cli", "crates/slate-gui"]
# `cargo build` produces both executables: `slate` (terminal, no Qt) and
# `slate-gui` (graphical). `cargo build -p slate` builds only the former.
default-members = [".", "crates/slate-gui"]
resolver = "2"

# Versions shared by several crates are declared once here.
[workspace.dependencies]
slate-core = { path = "crates/slate-core" }
slate-cli = { path = "crates/slate-cli" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tempfile = "3"
portable-pty = "0.9"
vt100 = "0.16"

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.89"

[package]
name = "slate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
slate-core.workspace = true
slate-cli.workspace = true
anyhow.workspace = true

[profile.release]
lto = "thin"

[dev-dependencies]
serde_json.workspace = true
portable-pty.workspace = true
vt100.workspace = true
tempfile.workspace = true
libc.workspace = true
