name: Build Linux amd64 DEB

# Manual artifact build; MattPackages publication uses PublishMattOSPackage.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64-deb:
    runs-on: ubuntu-24.04
    # Match Basalt's package target and use distro-provided Qt/Kirigami.
    container: ubuntu:26.04
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash DevUtils/InstallDependencies.sh
      - name: Install release Rust toolchain
        run: |
          useradd --create-home --shell /bin/bash slate-build
          chown -R slate-build:slate-build "$GITHUB_WORKSPACE"
          runuser -u slate-build -- sh -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0 --component rustfmt --component clippy'
      - run: python3 -m unittest discover -s tests -v
      - name: Test and build as an unprivileged user
        run: runuser -u slate-build -- env PATH="/home/slate-build/.cargo/bin:$PATH" bash DevUtils/Build.sh
      - run: python3 scripts/deb-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: slate-linux-amd64-deb
          path: builds/*.deb
          if-no-files-found: error
