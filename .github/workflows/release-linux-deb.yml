name: Build Linux amd64 DEB

# Manual artifact build; MattPackages publication uses PublishMattOSPackage.py.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64-deb:
    runs-on: ubuntu-24.04
    # Match Basalt's package target and use distro-provided Qt/Kirigami.
    container: ubuntu:26.04
    steps:
      - name: Install checkout dependencies
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash DevUtils/InstallDependencies.sh
      - name: Install release Rust toolchain
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0 --component rustfmt --component clippy
      - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s tests -v
      - run: bash DevUtils/Build.sh
      - run: python3 scripts/deb-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: slate-linux-amd64-deb
          path: builds/*.deb
          if-no-files-found: error
