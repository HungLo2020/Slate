name: Slate checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Qt API build environment and terminal tools
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config qt6-base-dev qt6-declarative-dev vim-tiny htop tmux openssh-client openssh-server aspell aspell-en gdb
      - name: Install release Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: python3 DevUtils/dependency-policy.py
      - run: python3 -m unittest discover -s tests -v
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
        env:
          SLATE_REQUIRE_TERMINAL_TOOLS: "1"
      # Builds both executables: slate (terminal, no Qt) and slate-gui.
      - run: cargo build --release
      - run: python3 DevUtils/SmokeTests/Packaging/install-smoke.py target/release/slate
      - run: python3 DevUtils/SmokeTests/Terminal/startup-smoke.py target/release/slate --tui-only
      - run: python3 DevUtils/SmokeTests/Terminal/tab-close-smoke.py target/release/slate
      - run: python3 DevUtils/SmokeTests/Terminal/recovery-smoke.py target/release/slate
      - run: python3 DevUtils/SmokeTests/Terminal/recovery-smoke.py target/release/slate-gui
      - name: Verify optional TUI-only installation
        run: cargo build --release --package slate && python3 DevUtils/SmokeTests/Packaging/install-smoke.py target/release/slate --tui-only
      # The audio smoke loads a window like a desktop install, so this host needs
      # the QML runtime modules the GUI job's container installs as well.
      - name: Install QML runtime and optional audio modules
        run: sudo apt-get install -y qml6-module-qtquick qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript fonts-dejavu-core qml6-module-qtmultimedia libqt6multimedia6 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - run: cargo build --release --package slate --package slate-gui --features slate-gui/smoke
      # Qt Multimedia is optional: the smoke reports a skip when the module,
      # a decoder or an audio device is missing.
      - name: Audio playback with optional Qt Multimedia
        run: python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/release/slate
        env:
          SLATE_GUI_MEDIA_SMOKE: "1"
      # Qt 6.4 builds the public adapter API here. Ubuntu 24.04 has no Kirigami 6 runtime.
  gui:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora:latest, debian:trixie]
    container: ${{ matrix.distro }}
    steps:
      - name: Install distro-provided Qt packages (no KDE frameworks needed)
        shell: sh
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y git gcc-c++ cmake pkgconf-pkg-config curl rust cargo qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qtsvg dejavu-sans-mono-fonts python3
          else
            apt-get update
            apt-get install -y git g++ cmake pkg-config curl ca-certificates qt6-base-dev qt6-declarative-dev qt6-svg-plugins qml6-module-qtquick qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript fonts-dejavu-core python3 libglib2.0-bin
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - run: cargo build --package slate --package slate-gui --features slate-gui/smoke
      - run: python3 DevUtils/SmokeTests/Terminal/startup-smoke.py target/debug/slate
      - run: python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: python3 DevUtils/SmokeTests/Gui/gui-image-smoke.py target/debug/slate-gui
      - run: SLATE_GUI_PRODUCTION_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: python3 DevUtils/SmokeTests/Gui/gui-geometry-smoke.py target/debug/slate
      - run: SLATE_GUI_FEATURE_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_COMMAND_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_TAB_CLOSE_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_DIFF_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_GIT_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_DESKTOP_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_IDE_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_FILE_DIALOG_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: python3 DevUtils/SmokeTests/Gui/single-instance-smoke.py target/debug/slate-gui
      - run: python3 DevUtils/SmokeTests/Gui/editor-wait-smoke.py target/debug/slate-gui
      - run: python3 DevUtils/SmokeTests/Gui/gui-termination-smoke.py target/debug/slate
      - name: Require KDE style and desktop integration coverage
        if: matrix.distro == 'debian:trixie'
        run: apt-get install -y qml6-module-org-kde-desktop plasma-integration qt6-wayland xvfb xauth dbus-x11 weston python3-gi gir1.2-atspi-2.0 at-spi2-core orca
      - run: python3 DevUtils/SmokeTests/Gui/gui-layout-smoke.py target/debug/slate
        env:
          SLATE_REQUIRE_KDE_STYLE: ${{ matrix.distro == 'debian:trixie' && '1' || '' }}
      - name: Test real display backends and AT-SPI
        if: matrix.distro == 'debian:trixie'
        env:
          SLATE_REQUIRE_ORCA: "1"
        run: |
          xvfb-run -a python3 DevUtils/SmokeTests/Gui/gui-desktop-integration.py target/debug/slate
          dbus-run-session -- python3 DevUtils/SmokeTests/Gui/gui-wayland-smoke.py target/debug/slate
      - run: SLATE_GUI_AUDIT_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: SLATE_GUI_MARKUP_SMOKE=1 python3 DevUtils/SmokeTests/Gui/gui-offscreen-smoke.py target/debug/slate
      - run: python3 DevUtils/SmokeTests/Terminal/recovery-smoke.py target/debug/slate
      - run: cargo build --release --package slate --package slate-gui --features slate-gui/smoke
      - run: python3 DevUtils/SmokeTests/Gui/gui-performance-smoke.py target/release/slate

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 check --locked --package slate --all-targets
