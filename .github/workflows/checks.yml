name: Slate checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Qt API build environment and terminal tools
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config qt6-base-dev qt6-declarative-dev vim-tiny htop tmux openssh-client openssh-server
      - name: Install current stable Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - run: python3 scripts/dependency-policy.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
        env:
          SLATE_REQUIRE_TERMINAL_TOOLS: "1"
      - run: cargo build --release
      - run: python3 scripts/install-smoke.py target/release/slate
      - run: python3 scripts/recovery-smoke.py target/release/slate
      - name: Verify optional TUI-only installation
        run: cargo build --release --no-default-features && python3 scripts/install-smoke.py target/release/slate --tui-only
      # Qt 6.4 builds the public adapter API here. Ubuntu 24.04 has no Kirigami 6 runtime.
  gui:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora:latest, debian:trixie]
    container: ${{ matrix.distro }}
    steps:
      - name: Install distro-provided Qt and Kirigami packages
        shell: sh
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y git gcc-c++ cmake pkgconf-pkg-config curl rust cargo qt6-qtbase-devel qt6-qtdeclarative-devel kf6-kirigami dejavu-sans-mono-fonts python3
          else
            apt-get update
            apt-get install -y git g++ cmake pkg-config curl ca-certificates qt6-base-dev qt6-declarative-dev qml6-module-org-kde-kirigami qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript fonts-dejavu-core python3
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - uses: actions/checkout@v4
      - run: cargo build --features gui-smoke
      - run: python3 scripts/gui-offscreen-smoke.py target/debug/slate
      - run: python3 scripts/gui-layout-smoke.py target/debug/slate
      - run: python3 scripts/recovery-smoke.py target/debug/slate
