[package]
name = "slate-gui"
version.workspace = true
edition.workspace = true

[features]
smoke = []

[dependencies]
anyhow = "1"
slate-core = { path = "../slate-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
cmake = "0.1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
